[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-exchange-service"
version = "1.0.0"
description = "Contract-first REST service for exchanging file threat intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator[black,isort]>=0.30,<1",
    "httpx>=0.28,<1",
    "openapi-spec-validator>=0.7,<1",
    "openapi-schema-validator>=0.6,<1",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["openapi.yaml", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/generated/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
