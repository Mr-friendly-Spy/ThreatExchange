# Usage: docker compose -f compose.yaml -f compose.https.yaml up --build -d
# Compose 2.24.4+ is required for !override.
services:
  api:
    ports: !override []
    environment:
      THREAT_PUBLIC_URL: https://localhost:${THREAT_HTTPS_PORT:-8443}
  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    ports:
      - "${THREAT_BIND_ADDRESS:-127.0.0.1}:${THREAT_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    # The official Caddy executable carries this file capability, even on port 8443.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
